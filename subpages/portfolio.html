<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* General styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Darker shade for modern look */
            color: #e0e0e0; /* Slightly softer white for better contrast */
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        /* Header styling */
        h1 {
            font-size: 2.5rem;
            margin: 20px 0;
            color: #f3c623; /* Highlight color for the title */
        }

        /* Project list container */
        ul {
            list-style: none;
            padding: 0;
            margin: 20px auto;
            max-width: 600px; /* Keeps list centered and neat */
            text-align: left; /* Aligns items to the left for a professional feel */
        }

        /* Individual project items */
        li {
            font-size: 1.2rem;
            margin: 15px 0; /* Consistent spacing */
            padding: 10px;
            background: #1e1e1e; /* Card-like background for each project */
            border-radius: 10px; /* Soft rounded corners */
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.6); /* Subtle shadow for depth */
            transition: transform 0.3s, background 0.3s; /* Smooth hover effect */
        }

        /* Hover effect for project items */
        li:hover {
            transform: scale(1.05); /* Slight zoom on hover */
            background: #f3c623; /* Highlight color on hover */
            color: #121212; /* Text contrast on hover */
        }
    </style>
</head>
<body>
    <h1>My Projects</h1>
    <ul>
        <li>Project 1</li>
        <li>Project 2</li>
        <li>Project 3</li>
        <li>Project 4</li>
    </ul>
</body>
</html>
